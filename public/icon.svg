<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14365d"/>
      <stop offset="100%" stop-color="#0a1d33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle gold inner accent border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Center Badge / Whistle Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Whistle body -->
    <!-- Sound chamber / sphere -->
    <circle cx="210" cy="240" r="74" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
    <!-- Hole / pea cavity inside chamber -->
    <circle cx="210" cy="240" r="34" fill="#0a1d33" opacity="0.3"/>
    
    <!-- Barrel / mouthpiece -->
    <path d="M 210,166 L 350,166 C 362,166 372,176 372,188 L 372,216 C 372,228 362,238 350,238 L 270,238 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Top slit / window -->
    <rect x="250" y="180" width="46" height="18" rx="4" fill="#0a1d33" opacity="0.35"/>
    
    <!-- Ring on chamber -->
    <ellipse cx="134" cy="240" rx="14" ry="32" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

    <!-- Dynamic sound waves / whistles -->
    <path d="M 330,135 Q 360,115 390,135" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 350,105 Q 390,80 430,105" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Typography -->
  <!-- RHTC -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">RHTC</text>
  <!-- SCHIEDSRICHTER -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="6">SCHIEDSRICHTER</text>
</svg>
